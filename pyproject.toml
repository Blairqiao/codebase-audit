[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-audit"
version = "0.1.0"
description = "Evidence-linked audits of enrolled Git repositories"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.25,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<3", "build>=1.3,<2", "types-jsonschema>=4.25"]

[project.scripts]
repo-audit = "repo_audit.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/repo-audit/schemas" = ["schemas/*.json"]
"share/repo-audit/policies" = ["policies/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.package-data]
"repo_audit.agents" = ["audit_prompt.md"]
